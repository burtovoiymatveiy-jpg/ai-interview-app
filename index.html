<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Трекер АмГУ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background-color: var(--tg-theme-bg-color, #181818); color: var(--tg-theme-text-color, #ffffff); padding: 15px; margin: 0; }
        
        input, button { 
            width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px; 
            border: 1px solid var(--tg-theme-hint-color, #444); 
            background-color: var(--tg-theme-secondary-bg-color, #333);
            color: var(--tg-theme-text-color, #fff); font-size: 16px; 
            -webkit-appearance: none; display: block;
        }

        .date-wrapper { position: relative; width: 100%; margin-bottom: 12px; }
        .date-wrapper input[type="date"] { color: transparent; min-height: 48px; margin-bottom: 0; }
        .date-wrapper input.has-value { color: #fff; }
        .date-placeholder { position: absolute; left: 15px; top: 14px; color: #aaa; pointer-events: none; }

        .save-btn { background-color: var(--tg-theme-button-color, #2481cc); font-weight: bold; border: none; }
        
        .task-card { background: var(--tg-theme-secondary-bg-color, #2c2c2c); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        
        /* Кнопки действий */
        .controls { display: flex; gap: 8px; margin-top: 10px; }
        .study-btn { background-color: #00b894; color: white; border: none; flex: 2; padding: 10px; border-radius: 8px; font-weight: bold; }
        .del-btn { background-color: #d63031; color: white; border: none; flex: 1; padding: 10px; border-radius: 8px; }

        /* Окно ИИ-конспекта */
        .ai-summary-box { 
            display: none; background: #111; padding: 12px; border-radius: 8px; 
            margin-top: 10px; border-left: 4px solid #00b894; font-size: 14px; line-height: 1.5;
        }
        .ai-section-title { color: #00b894; font-weight: bold; margin-top: 8px; display: block; text-transform: uppercase; font-size: 11px; }
    </style>
</head>
<body>
    <h2>Новый дедлайн</h2>
    <input type="text" id="subject-input" placeholder="Предмет (например, БД)">
    <input type="text" id="task-name" placeholder="Тема (например, Нормальные формы)">
    <div class="date-wrapper">
        <input type="date" id="task-date" onchange="this.classList.toggle('has-value', !!this.value); document.getElementById('date-placeholder').style.display = this.value ? 'none' : 'block';">
        <div class="date-placeholder" id="date-placeholder">Дата</div>
    </div>
    <button class="save-btn" onclick="addTask()">Добавить в список</button>

    <h2>Мои задачи</h2>
    <div id="tasks-list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let tasks = [];

        tg.CloudStorage.getItem('amgu_v3', (err, val) => { if(!err && val) { tasks = JSON.parse(val); renderTasks(); } });

        async function getSummary(id, subject, theme) {
            const box = document.getElementById(`summary-${id}`);
            box.style.display = 'block';
            box.innerHTML = "<i>ИИ готовит конспект...</i>";
            
            const prompt = `Ты помощник студента. Составь краткий учебный конспект. 
            Предмет: ${subject}. Тема: ${theme}. 
            Структура: 
            1. ТЕЗИСЫ (суть темы за 30 секунд).
            2. ТЕРМИНЫ (важные определения).
            3. ВОПРОСЫ (3 вопроса от препода и ответы).
            4. ЛАЙФХАК (что сказать, если не учил). 
            Пиши кратко и по делу.`;

            try {
                const r = await fetch('https://text.pollinations.ai/openai', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({messages: [{role: 'user', content: prompt}]})
                });
                const text = await r.text();
                
                // Форматируем текст для красоты
                box.innerHTML = text.replace(/(ТЕЗИСЫ|ТЕРМИНЫ|ВОПРОСЫ|ЛАЙФХАК):/g, '<span class="ai-section-title">$1</span>');
                tg.HapticFeedback.impactOccurred('medium');
            } catch (e) { box.innerText = "Ошибка связи с ИИ."; }
        }

        function addTask() {
            const s = document.getElementById('subject-input').value;
            const t = document.getElementById('task-name').value;
            const d = document.getElementById('task-date').value;
            if(!s || !t || !d) return tg.showAlert("Заполни все поля!");

            tasks.push({id: Date.now(), subject: s, theme: t, date: new Date(d).toLocaleDateString('ru-RU')});
            tg.CloudStorage.setItem('amgu_v3', JSON.stringify(tasks));
            renderTasks();
            tg.HapticFeedback.notificationOccurred('success');
        }

        function deleteTask(id) {
            tasks = tasks.filter(x => x.id !== id);
            tg.CloudStorage.setItem('amgu_v3', JSON.stringify(tasks));
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('tasks-list');
            list.innerHTML = tasks.map(t => `
                <div class="task-card">
                    <strong>${t.subject}</strong>: ${t.theme}
                    <span class="date-placeholder" style="position:static; display:block; margin-top:5px;">До: ${t.date}</span>
                    <div id="summary-${t.id}" class="ai-summary-box"></div>
                    <div class="controls">
                        <button class="study-btn" onclick="getSummary(${t.id}, '${t.subject}', '${t.theme}')">📚 Подготовиться</button>
                        <button class="del-btn" onclick="deleteTask(${t.id})">🗑</button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
