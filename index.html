<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер АмГУ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, sans-serif; 
            background-color: var(--tg-theme-bg-color, #181818); 
            color: var(--tg-theme-text-color, #ffffff); 
            padding: 15px; margin: 0; 
        }
        
        input, textarea, button { 
            width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 10px; 
            border: 1px solid var(--tg-theme-hint-color, #444); 
            background-color: var(--tg-theme-secondary-bg-color, #333);
            color: var(--tg-theme-text-color, #fff); font-size: 16px; 
            outline: none;
        }
        
        textarea { resize: none; height: 70px; font-family: inherit; }

        /* Вкладки */
        .tabs { display: flex; gap: 8px; margin: 10px 0 20px 0; }
        .tab-btn { 
            flex: 1;
            background: var(--tg-theme-secondary-bg-color, #333); 
            border: 1px solid var(--tg-theme-hint-color, #444);
            padding: 10px; cursor: pointer; font-size: 14px; transition: 0.2s;
        }
        .tab-btn.active { 
            background: var(--tg-theme-button-color, #2481cc); 
            color: var(--tg-theme-button-text-color, #fff);
            border-color: transparent; font-weight: bold;
        }

        .task-card { 
            background-color: var(--tg-theme-secondary-bg-color, #2c2c2c); 
            padding: 15px; border-radius: 10px; margin-bottom: 12px; 
            display: flex; justify-content: space-between; align-items: flex-start; 
            border-left: 6px solid #4caf50; 
        }
        .task-card.critical { border-left-color: #ff4d4d; } 
        .task-card.warning { border-left-color: #ff9800; }  
        .task-card.expired { border-left-color: #777; opacity: 0.8; }

        .task-info { flex-grow: 1; padding-right: 10px; word-break: break-word; }
        .task-date { color: var(--tg-theme-hint-color, #aaa); font-size: 12px; display: block; margin-top: 6px; }
        .task-desc-val { font-size: 14px; color: #bbb; margin-top: 5px; line-height: 1.3; }
        
        .actions { display: flex; flex-direction: column; gap: 6px; width: 85px; flex-shrink: 0; }
        .btn-s { padding: 8px; font-size: 12px; margin: 0; border: none; font-weight: bold; cursor: pointer; }
        .edit-btn { background: #f39c12; color: white; }
        .del-btn { background: #ff4d4d; color: white; }
        .save-btn { background: var(--tg-theme-button-color, #2481cc); font-weight: bold; border: none; margin-top: 5px; }
    </style>
</head>
<body>
    <h2 id="f-title" style="margin-top:0;">Новый дедлайн</h2>
    <input type="text" id="subject" placeholder="Предмет">
    <input type="text" id="name" placeholder="Задание (напр. Лаба №2)">
    <textarea id="desc" placeholder="Доп. информация..."></textarea>
    <input type="date" id="date">
    <button class="save-btn" onclick="saveTask()">Сохранить задачу</button>

    <div class="tabs">
        <button id="tab-active" class="tab-btn active" onclick="setTab('active')">Активные</button>
        <button id="tab-expired" class="tab-btn" onclick="setTab('expired')">Просроченные</button>
    </div>
    
    <div id="list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let tasks = [];
        let editingId = null;
        let currentTab = 'active';

        // Ключ для CloudStorage (лучше менять при крупных обновлениях структуры)
        const STORAGE_KEY = 'amgu_deadlines_final';

        tg.CloudStorage.getItem(STORAGE_KEY, (err, val) => {
            if (!err && val) { 
                try {
                    tasks = JSON.parse(val); 
                } catch(e) { tasks = []; }
                renderTasks(); 
            }
        });

        function save() { tg.CloudStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

        function setTab(tab) {
            currentTab = tab;
            document.getElementById('tab-active').classList.toggle('active', tab === 'active');
            document.getElementById('tab-expired').classList.toggle('active', tab === 'expired');
            renderTasks();
        }

        function saveTask() {
            const s = document.getElementById('subject').value.trim();
            const n = document.getElementById('name').value.trim();
            const d = document.getElementById('desc').value.trim();
            const raw = document.getElementById('date').value;

            if (!s || !n || !raw) {
                tg.showAlert("Заполните все поля (кроме описания)!");
                return;
            }

            if (editingId) {
                const i = tasks.findIndex(t => t.id === editingId);
                if(i !== -1) tasks[i] = { ...tasks[i], subject:s, name:n, desc:d, dateRaw:raw };
                editingId = null;
            } else {
                tasks.push({ id: Date.now(), subject:s, name:n, desc:d, dateRaw:raw });
            }

            save();
            clearForm();
            renderTasks();
            tg.HapticFeedback.notificationOccurred('success');
        }

        function clearForm() {
            ['subject','name','desc','date'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('f-title').innerText = "Новый дедлайн";
            editingId = null;
        }

        function editTask(id) {
            const t = tasks.find(x => x.id === id);
            if(!t) return;
            document.getElementById('subject').value = t.subject;
            document.getElementById('name').value = t.name;
            document.getElementById('desc').value = t.desc;
            document.getElementById('date').value = t.dateRaw;
            editingId = id;
            document.getElementById('f-title').innerText = "Редактирование";
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function deleteTask(id) {
            tg.showConfirm('Удалить эту задачу?', (confirmed) => {
                if (confirmed) {
                    tasks = tasks.filter(t => t.id !== id);
                    if(editingId === id) clearForm();
                    save(); 
                    renderTasks();
                    tg.HapticFeedback.impactOccurred('medium');
                }
            });
        }

        function renderTasks() {
            const container = document.getElementById('list');
            container.innerHTML = '';
            
            const now = new Date();
            now.setHours(0,0,0,0);

            // 1. Очистка старых данных (просрочено более чем на 1 день)
            const oldLength = tasks.length;
            tasks = tasks.filter(t => {
                const deadline = new Date(t.dateRaw);
                const diff = Math.ceil((deadline - now) / 86400000);
                return diff >= -1; 
            });
            if (tasks.length !== oldLength) save();

            // 2. Фильтрация для текущей вкладки
            const filtered = tasks.filter(t => {
                const deadline = new Date(t.dateRaw);
                const diff = Math.ceil((deadline - now) / 86400000);
                return currentTab === 'active' ? diff >= 0 : diff < 0;
            }).sort((a,b) => new Date(a.dateRaw) - new Date(b.dateRaw));

            if(filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#777; margin-top:20px;">Список пуст</div>`;
                return;
            }

            filtered.forEach(t => {
                const deadline = new Date(t.dateRaw);
                const diff = Math.ceil((deadline - now) / 86400000);
                
                let cls = '';
                let statusText = `Дней осталось: ${diff}`;

                if (diff < 0) {
                    cls = 'expired';
                    statusText = 'Срок истек (будет удалено завтра)';
                } else if (diff <= 2) {
                    cls = 'critical';
                } else if (diff <= 5) {
                    cls = 'warning';
                }

                container.innerHTML += `
                    <div class="task-card ${cls}">
                        <div class="task-info">
                            <strong style="color:var(--tg-theme-button-color, #2481cc);">${t.subject}</strong><br>
                            <b>${t.name}</b>
                            ${t.desc ? `<div class="task-desc-val">${t.desc}</div>` : ''}
                            <span class="task-date">📅 До: ${deadline.toLocaleDateString('ru-RU')}<br>${statusText}</span>
                        </div>
                        <div class="actions">
                            <button class="btn-s edit-btn" onclick="editTask(${t.id})">Правка</button>
                            <button class="btn-s del-btn" onclick="deleteTask(${t.id})">Удалить</button>
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
