<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер АмГУ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Принудительный сброс для всех элементов */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, sans-serif; 
            background-color: var(--tg-theme-bg-color, #181818); 
            color: var(--tg-theme-text-color, #ffffff); 
            padding: 15px; 
        }
        
        /* Единый стиль для всех полей ввода */
        input, textarea, button { 
            width: 100%; 
            height: 48px; /* Фиксированная высота для всех однострочных полей */
            padding: 12px; 
            margin-bottom: 12px; 
            border-radius: 10px; 
            border: 1px solid var(--tg-theme-hint-color, #444); 
            background-color: var(--tg-theme-secondary-bg-color, #333);
            color: var(--tg-theme-text-color, #fff); 
            font-size: 16px; 
            outline: none;
            display: block;
            -webkit-appearance: none;
        }
        
        textarea { height: 80px; resize: none; font-family: inherit; }

        /* Контейнер для даты */
        .date-wrapper { position: relative; width: 100%; margin-bottom: 12px; }
        
        /* Само поле даты теперь точно совпадает по размерам */
        #date { 
            color: transparent; 
            cursor: pointer;
        }
        #date.has-value { color: var(--tg-theme-text-color, #fff); }

        /* Наложение слова "Дата" */
        .date-placeholder { 
            position: absolute; 
            left: 12px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: var(--tg-theme-hint-color, #aaa); 
            pointer-events: none; 
            font-size: 16px;
        }

        /* Кнопки вкладок */
        .tabs { display: flex; gap: 8px; margin: 10px 0 20px 0; }
        .tab-btn { 
            flex: 1; height: 40px; padding: 0; margin: 0;
            background: var(--tg-theme-secondary-bg-color, #333); 
            font-size: 14px;
        }
        .tab-btn.active { 
            background: var(--tg-theme-button-color, #2481cc); 
            color: white; border-color: transparent; font-weight: bold;
        }

        /* Карточки задач */
        .task-card { 
            background-color: var(--tg-theme-secondary-bg-color, #2c2c2c); 
            padding: 15px; border-radius: 10px; margin-bottom: 12px; 
            display: flex; justify-content: space-between; align-items: flex-start;
            border-left: 6px solid #4caf50; 
        }
        .task-card.critical { border-left-color: #ff4d4d; } 
        .task-card.warning { border-left-color: #ff9800; }  
        .task-card.expired { border-left-color: #777; opacity: 0.7; }

        .actions { display: flex; flex-direction: column; gap: 6px; width: 85px; flex-shrink: 0; }
        .btn-s { height: 32px; padding: 0; font-size: 12px; margin: 0; border: none; font-weight: bold; }
        .edit-btn { background: #f39c12; color: white; }
        .del-btn { background: #ff4d4d; color: white; }
        .save-btn { background: var(--tg-theme-button-color, #2481cc); font-weight: bold; color: white; }
    </style>
</head>
<body>
    <h2 id="f-title" style="margin-bottom:15px; font-size:20px;">Новый дедлайн</h2>
    
    <input type="text" id="subject" placeholder="Предмет">
    <input type="text" id="name" placeholder="Название задания">
    <textarea id="desc" placeholder="Описание (необязательно)"></textarea>
    
    <div class="date-wrapper">
        <input type="date" id="date" onchange="dateChanged(this)">
        <div class="date-placeholder" id="date-label">Дата</div>
    </div>
    
    <button class="save-btn" onclick="saveTask()">Сохранить задачу</button>

    <div class="tabs">
        <button id="tab-active" class="tab-btn active" onclick="setTab('active')">Активные</button>
        <button id="tab-expired" class="tab-btn" onclick="setTab('expired')">Просрочено</button>
    </div>
    
    <div id="list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let tasks = [];
        let editingId = null;
        let currentTab = 'active';

        tg.CloudStorage.getItem('amgu_final_v5', (err, val) => {
            if (!err && val) { tasks = JSON.parse(val); renderTasks(); }
        });

        function dateChanged(el) {
            const label = document.getElementById('date-label');
            if (el.value) {
                el.classList.add('has-value');
                label.style.display = 'none';
            } else {
                el.classList.remove('has-value');
                label.style.display = 'block';
            }
        }

        function setTab(tab) {
            currentTab = tab;
            document.getElementById('tab-active').classList.toggle('active', tab === 'active');
            document.getElementById('tab-expired').classList.toggle('active', tab === 'expired');
            renderTasks();
        }

        function saveTask() {
            const s = document.getElementById('subject').value.trim();
            const n = document.getElementById('name').value.trim();
            const d = document.getElementById('desc').value.trim();
            const raw = document.getElementById('date').value;

            if (!s || !n || !raw) return tg.showAlert("Заполните предмет, название и дату!");

            if (editingId) {
                const i = tasks.findIndex(t => t.id === editingId);
                tasks[i] = { ...tasks[i], subject:s, name:n, desc:d, dateRaw:raw };
                editingId = null;
            } else {
                tasks.push({ id: Date.now(), subject:s, name:n, desc:d, dateRaw:raw });
            }

            tg.CloudStorage.setItem('amgu_final_v5', JSON.stringify(tasks));
            clearForm();
            renderTasks();
            tg.HapticFeedback.notificationOccurred('success');
        }

        function clearForm() {
            ['subject','name','desc','date'].forEach(id => document.getElementById(id).value = '');
            dateChanged(document.getElementById('date'));
            document.getElementById('f-title').innerText = "Новый дедлайн";
            editingId = null;
        }

        function editTask(id) {
            const t = tasks.find(x => x.id === id);
            document.getElementById('subject').value = t.subject;
            document.getElementById('name').value = t.name;
            document.getElementById('desc').value = t.desc;
            document.getElementById('date').value = t.dateRaw;
            dateChanged(document.getElementById('date'));
            editingId = id;
            document.getElementById('f-title').innerText = "Правка задачи";
            window.scrollTo({top:0, behavior:'smooth'});
        }

        function deleteTask(id) {
            tg.showConfirm('Удалить?', (ok) => {
                if(ok) {
                    tasks = tasks.filter(t => t.id !== id);
                    tg.CloudStorage.setItem('amgu_final_v5', JSON.stringify(tasks));
                    renderTasks();
                }
            });
        }

        function renderTasks() {
            const container = document.getElementById('list');
            container.innerHTML = '';
            const now = new Date();
            now.setHours(0,0,0,0);

            // Удаляем старые (старше 1 дня)
            tasks = tasks.filter(t => Math.ceil((new Date(t.dateRaw) - now) / 86400000) >= -1);

            const filtered = tasks.filter(t => {
                const diff = Math.ceil((new Date(t.dateRaw) - now) / 86400000);
                return currentTab === 'active' ? diff >= 0 : diff < 0;
            }).sort((a,b) => new Date(a.dateRaw) - new Date(b.dateRaw));

            filtered.forEach(t => {
                const diff = Math.ceil((new Date(t.dateRaw) - now) / 86400000);
                let cls = diff < 0 ? 'expired' : (diff <= 2 ? 'critical' : (diff <= 5 ? 'warning' : ''));
                
                container.innerHTML += `
                    <div class="task-card ${cls}">
                        <div style="flex-grow:1; padding-right:10px;">
                            <strong style="color:var(--tg-theme-button-color, #2481cc);">${t.subject}</strong><br>
                            <b style="font-size:15px;">${t.name}</b>
                            <div style="font-size:13px; color:#aaa; margin-top:5px;">${t.desc}</div>
                            <span style="font-size:12px; display:block; margin-top:8px; opacity:0.8;">
                                📅 До: ${new Date(t.dateRaw).toLocaleDateString()} (${diff < 0 ? 'Истек' : 'Дней: '+diff})
                            </span>
                        </div>
                        <div class="actions">
                            <button class="btn-s edit-btn" onclick="editTask(${t.id})">Правка</button>
                            <button class="btn-s del-btn" onclick="deleteTask(${t.id})">Удалить</button>
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
