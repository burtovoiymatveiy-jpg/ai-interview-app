<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер АмГУ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color, #181818); color: var(--tg-theme-text-color, #ffffff); padding: 15px; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: none; font-size: 16px; }
        button { background-color: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #ffffff); font-weight: bold; }
        .card { background-color: var(--tg-theme-secondary-bg-color, #2c2c2c); padding: 15px; border-radius: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="group-section" class="card">
        <h3>Укажите группу</h3>
        <input type="text" id="group-input" placeholder="Например: 5104-об">
        <button onclick="updateGroup()">Обновить предметы</button>
    </div>

    <div id="main-app" class="card">
        <h3>Добавить дедлайн</h3>
        <select id="subject-select">
            <option>Сначала введите группу</option>
        </select>
        <input type="text" id="task-name" placeholder="Название работы">
        <input type="date" id="task-date">
        <button onclick="addTask()">Сохранить задачу</button>
    </div>

    <h3>Мои задачи</h3>
    <div id="tasks-list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Функция обновления группы
        async function updateGroup() {
            const group = document.getElementById('group-input').value;
            if (!group) return tg.showAlert("Введите номер группы!");
            
            tg.showConfirm(`Обновить список предметов для ${group}?`, (ok) => {
                if (ok) {
                    // Здесь мы имитируем загрузку. В реальности можно дернуть API Гитхаба
                    // Но для начала просто сохраним группу локально
                    localStorage.setItem('user_group', group);
                    loadSubjects();
                }
            });
        }

        async function loadSubjects() {
            const group = localStorage.getItem('user_group');
            if (!group) return;

            try {
                const response = await fetch('./data/schedule.json');
                const data = await response.json();
                const select = document.getElementById('subject-select');
                select.innerHTML = '';
                data.subjects.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s; opt.innerText = s;
                    select.appendChild(opt);
                });
            } catch (e) {
                // Если файла нет, дадим вводить предмет вручную
                const select = document.getElementById('subject-select');
                select.innerHTML = '<option value="custom">Введите предмет вручную ниже</option>';
            }
        }

        function addTask() {
            const sub = document.getElementById('subject-select').value;
            const name = document.getElementById('task-name').value;
            const date = document.getElementById('task-date').value;
            
            if(!name || !date) return tg.showAlert("Заполните поля!");

            const list = document.getElementById('tasks-list');
            list.innerHTML += `<div class="card"><b>${sub}</b><br>${name}<br><small>${date}</small></div>`;
            tg.HapticFeedback.impactOccurred('medium');
        }

        loadSubjects();
    </script>
</body>
</html>
