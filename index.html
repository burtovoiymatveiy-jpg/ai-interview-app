<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Трекер АмГУ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background-color: #000; color: #fff; padding: 15px; margin: 0; }
        
        h2 { font-size: 22px; margin: 10px 0 15px 0; }

        /* Поля ввода с выравниванием по левому краю */
        input, button { 
            width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; 
            border: 1px solid #444; background-color: #1c1c1e;
            color: #fff; font-size: 16px; display: block; outline: none;
            text-align: left !important; /* Убираем центрирование */
        }
        input::placeholder { color: #8e8e93; }

        /* Контейнер даты */
        .date-box { position: relative; width: 100%; margin-bottom: 12px; }
        .date-box input[type="date"] { color: transparent; min-height: 50px; }
        .date-box input.has-val { color: #fff; }
        .date-lbl { position: absolute; left: 15px; top: 15px; color: #8e8e93; pointer-events: none; }

        /* Кнопки */
        .btn-add { background-color: #4facfe; color: #fff; font-weight: 600; text-align: center !important; border: none; margin-top: 5px; }
        
        /* Карточка задачи */
        .card { background: #1c1c1e; padding: 16px; border-radius: 16px; margin-bottom: 15px; border: 1px solid #2c2c2e; }
        .card-date { color: #ff453a; font-size: 14px; margin-top: 6px; display: block; }
        
        .row { display: flex; gap: 10px; margin-top: 15px; }
        .btn-ai { background-color: #30d158; color: #fff; flex: 2; border: none; text-align: center !important; font-weight: bold; }
        .btn-del { background-color: #ff3b30; flex: 1; border: none; text-align: center !important; }

        /* Ответ ИИ */
        .ai-out { 
            display: none; background: #000; padding: 12px; border-radius: 10px; 
            margin-top: 12px; border-left: 4px solid #30d158; font-size: 14px; line-height: 1.4; 
        }
        .ai-tag { color: #30d158; font-weight: bold; display: block; margin-top: 8px; font-size: 11px; text-transform: uppercase; }
    </style>
</head>
<body>

    <h2>Новый дедлайн</h2>
    <input type="text" id="subj" placeholder="Предмет (например, БД)">
    <input type="text" id="topic" placeholder="Тема (например, Нормальные формы)">
    
    <div class="date-box">
        <input type="date" id="d-val" onchange="this.classList.toggle('has-val', !!this.value); document.getElementById('d-lbl').style.display = this.value ? 'none' : 'block';">
        <div class="date-lbl" id="d-lbl">Дата</div>
    </div>

    <button class="btn-add" onclick="add()">Добавить в список</button>

    <h2>Мои задачи</h2>
    <div id="list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let items = [];

        // Загрузка данных из облака ТГ
        tg.CloudStorage.getItem('amgu_data_v6', (err, val) => {
            if(!err && val) { items = JSON.parse(val); show(); }
        });

        async function ask(id, s, t) {
            const out = document.getElementById(`ai-${id}`);
            out.style.display = 'block';
            out.innerHTML = "<i>Запрос к ИИ...</i>";
            tg.HapticFeedback.impactOccurred('light');

            try {
                // Используем обновленный стабильный адрес
                const r = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        messages: [{role: 'user', content: `Кратко разбери тему "${t}" по предмету "${s}". Разделы: ТЕЗИСЫ, ТЕРМИНЫ, ВОПРОСЫ, ЛАЙФХАК.`}],
                        model: 'openai'
                    })
                });
                
                const res = await r.text();
                
                if (res.includes('error') || res.length < 5) {
                    out.innerHTML = "<span style='color:#ff453a'>У ИИ перегрузка. Попробуй через пару минут.</span>";
                } else {
                    out.innerHTML = res.replace(/(ТЕЗИСЫ|ТЕРМИНЫ|ВОПРОСЫ|ЛАЙФХАК):/g, '<span class="ai-tag">$1</span>');
                }
            } catch (e) { out.innerText = "Ошибка сети."; }
        }

        function add() {
            const s = document.getElementById('subj').value;
            const t = document.getElementById('topic').value;
            const d = document.getElementById('d-val').value;

            if(!s || !t || !d) return tg.showAlert("Заполни все поля!");

            items.push({
                id: Date.now(), 
                s, t, 
                d: new Date(d).toLocaleDateString('ru-RU')
            });

            save();
            show();
            
            tg.HapticFeedback.notificationOccurred('success');
            document.getElementById('subj').value = '';
            document.getElementById('topic').value = '';
            document.getElementById('d-val').value = '';
        }

        function del(id) {
            tg.showConfirm('Удалить?', (ok) => {
                if(ok) { items = items.filter(i => i.id !== id); save(); show(); }
            });
        }

        function save() {
            tg.CloudStorage.setItem('amgu_data_v6', JSON.stringify(items));
        }

        function show() {
            const container = document.getElementById('list');
            if (items.length === 0) {
                container.innerHTML = '<p style="color:#8e8e93; font-size:14px;">Пока задач нет</p>';
                return;
            }
            container.innerHTML = items.map(i => `
                <div class="card">
                    <strong>${i.s}</strong>: ${i.t}
                    <span class="card-date">До: ${i.d}</span>
                    <div id="ai-${i.id}" class="ai-out"></div>
                    <div class="row">
                        <button class="btn-ai" onclick="ask(${i.id}, '${i.s}', '${i.t}')">📚 Подготовиться</button>
                        <button class="btn-del" onclick="del(${i.id})">🗑</button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
