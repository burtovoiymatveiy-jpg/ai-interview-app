<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmGU Deadline Tracker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Трекер дедлайнов АмГУ</h1>
    <p>Привет, <span id="user-name">студент</span>!</p>
    <div id="setup">
        <input type="text" id="group-id" placeholder="Введите номер группы">
        <button onclick="saveGroup()">Загрузить расписание</button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Развернуть на весь экран

        if (tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
        }

        function saveGroup() {
            const group = document.getElementById('group-id').value;
            if (group) {
                alert('Группа ' + group + ' сохранена. Скоро подтянем расписание!');
                // Здесь будет логика вызова твоего парсера через GitHub Actions
            }
        }
    </script>
</body>
</html>
