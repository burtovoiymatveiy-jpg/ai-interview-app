<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>АмГУ: Трекер v0.30</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #000000; --sec-bg: #1c1c1d; --text: #ffffff; --hint: #8e8e93;
            --accent: #007aff; --card-bg: #1c1c1d; --danger: #ff3b30; 
            --warning: #ffcc00; --success: #34c759; --panel-bg: #1c1c1d; --input-bg: #2c2c2e;
        }

        [data-theme="light"] {
            --bg: #f2f2f7; --sec-bg: #ffffff; --text: #000000; --hint: #8e8e93;
            --accent: #007aff; --card-bg: #ffffff; --panel-bg: #ffffff; --input-bg: #f2f2f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background-color: var(--bg); color: var(--text); 
            padding: 20px 16px; display: flex; flex-direction: column;
            min-height: 100vh; transition: background 0.3s;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .header h1 { font-size: 21px; font-weight: 800; }
        
        .header-btns { display: flex; align-items: center; gap: 10px; }
        
        .theme-toggle {
            background: var(--sec-bg); border: 1px solid rgba(128,128,128,0.1); 
            width: 40px; height: 40px; border-radius: 12px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; font-size: 18px;
        }

        .status-pill {
            background: var(--sec-bg); padding: 6px 12px; border-radius: 20px;
            display: flex; align-items: center; gap: 8px; border: 1px solid rgba(128,128,128,0.1);
        }
        .status-count { font-size: 13px; font-weight: 700; }
        
        /* ГЛОБАЛЬНАЯ ПУЛЬСИРУЮЩАЯ ТОЧКА */
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hint); transition: 0.3s; }
        .dot-red { background: var(--danger); box-shadow: 0 0 10px var(--danger); animation: pulse-header-red 1.5s infinite ease-in-out; }
        .dot-yellow { background: var(--warning); box-shadow: 0 0 10px var(--warning); animation: pulse-header-yellow 1.5s infinite ease-in-out; }
        .dot-green { background: var(--success); box-shadow: 0 0 5px var(--success); }

        @keyframes pulse-header-red {
            0% { transform: scale(0.8); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.8; }
        }
        @keyframes pulse-header-yellow {
            0% { transform: scale(0.8); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.8; }
        }

        .search-box {
            background: var(--sec-bg); border-radius: 12px; padding: 12px;
            margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
        }
        .search-box input { background: transparent; border: none; color: var(--text); font-size: 16px; width: 100%; outline: none; }

        .tabs { display: flex; background: var(--sec-bg); padding: 2px; border-radius: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; text-align: center; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; color: var(--hint); }
        .tab.active { background: var(--accent); color: #fff; }

        .card { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 12px; position: relative; }
        .card-dot { width: 10px; height: 10px; border-radius: 50%; position: absolute; top: 18px; right: 16px; }

        /* ПУЛЬСАЦИЯ ВНУТРИ КАРТОЧКИ */
        .critical .card-dot { background: var(--danger); animation: pulse-card 2s infinite; }
        .warning .card-dot { background: var(--warning); animation: pulse-card-yellow 2s infinite; }
        .success .card-dot { background: var(--success); }
        .expired .card-dot { background: var(--hint); opacity: 0.5; }

        @keyframes pulse-card {
            0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(255, 59, 48, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }
        @keyframes pulse-card-yellow {
            0% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(255, 204, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0); }
        }

        .card-subj { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }
        .card-name { font-size: 17px; font-weight: 700; margin-bottom: 8px; max-width: 85%; }
        .card-meta { font-size: 12px; color: var(--hint); display: flex; justify-content: space-between; }

        .fab {
            position: fixed; bottom: 35px; right: 20px; 
            width: 56px; height: 56px; background: var(--accent); border-radius: 50%; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.3); border: none; z-index: 100;
        }
        .plus-icon {
            position: absolute; top: 50%; left: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%);
        }
        .plus-icon::before, .plus-icon::after {
            content: ''; position: absolute; background: #fff; border-radius: 2px;
        }
        .plus-icon::before { width: 100%; height: 3px; top: 7.5px; left: 0; }
        .plus-icon::after { width: 3px; height: 100%; top: 0; left: 7.5px; }

        .panel {
            position: fixed; bottom: -100%; left: 0; width: 100%; background: var(--panel-bg);
            border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px;
            transition: 0.4s cubic-bezier(0.1, 0.8, 0.2, 1); z-index: 200;
        }
        .panel.open { bottom: 0; }
        .panel input, .panel textarea { 
            width: 100%; background: var(--input-bg); border: 1px solid rgba(128,128,128,0.1);
            border-radius: 14px; padding: 0 15px; color: var(--text); font-size: 16px; margin-bottom: 12px; outline: none;
            height: 54px; -webkit-appearance: none;
        }
        .panel textarea { padding: 15px; min-height: 80px; height: auto; }
        .panel input[type="date"] { display: flex; align-items: center; color-scheme: dark; }

        .btn-save { background: var(--accent); color: #fff; width: 100%; height: 54px; border-radius: 14px; border: none; font-weight: 700; font-size: 16px; margin-top: 5px; }
        
        .footer { padding: 30px 0; text-align: center; margin-top: auto; }
        .version-tag { font-size: 9px; color: var(--hint); opacity: 0.5; letter-spacing: 2px; font-weight: 700; }
    </style>
</head>
<body data-theme="dark">

    <div class="header">
        <h1>АмГУ: Трекер</h1>
        <div class="header-btns">
            <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
            <div class="status-pill">
                <span class="status-count" id="count-text">0 ДЗ</span>
                <div class="status-dot" id="header-dot"></div>
            </div>
        </div>
    </div>

    <div class="search-box">
        <span>🔍</span>
        <input type="text" id="search" placeholder="Поиск..." oninput="render()">
    </div>

    <div class="tabs">
        <div id="t-act" class="tab active" onclick="setTab('active')">В работе</div>
        <div id="t-exp" class="tab" onclick="setTab('expired')">Просрочено</div>
    </div>

    <div id="list"></div>

    <div class="footer">
        <div class="version-tag">BETA v0.30</div>
    </div>

    <button class="fab" onclick="togglePanel()">
        <div class="plus-icon"></div>
    </button>

    <div class="panel" id="panel">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px; align-items:center;">
            <h2 style="font-size:20px;">Задание</h2>
            <span onclick="togglePanel()" style="font-size:24px; cursor:pointer; color:var(--hint);">✕</span>
        </div>
        <input type="text" id="subject" placeholder="📚 Предмет">
        <input type="text" id="name" placeholder="📝 Что сделать?">
        <textarea id="desc" placeholder="ℹ️ Детали (необязательно)"></textarea>
        <div style="font-size:12px; color:var(--hint); margin-bottom:5px; padding-left:5px;">Дедлайн:</div>
        <input type="date" id="date">
        <button class="btn-save" onclick="save()">Сохранить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        let tasks = []; let tab = 'active';

        function initTheme() {
            const saved = localStorage.getItem('user-theme');
            const sys = window.matchMedia('(prefers-color-scheme: dark)').matches;
            setTheme(saved || (sys ? 'dark' : 'light'));
        }

        function setTheme(t) {
            document.body.setAttribute('data-theme', t);
            document.getElementById('theme-btn').innerText = t === 'dark' ? '🌙' : '☀️';
            localStorage.setItem('user-theme', t);
        }

        function toggleTheme() {
            setTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            tg.HapticFeedback.impactOccurred('medium');
        }

        tg.ready(); tg.expand();
        tg.CloudStorage.getItem('tasks_v30', (err, val) => {
            if (!err && val) tasks = JSON.parse(val);
            render();
        });

        function togglePanel() {
            tg.HapticFeedback.impactOccurred('light');
            document.getElementById('panel').classList.toggle('open');
        }

        function setTab(t) {
            tab = t;
            tg.HapticFeedback.impactOccurred('light');
            document.getElementById('t-act').classList.toggle('active', t === 'active');
            document.getElementById('t-exp').classList.toggle('active', t === 'expired');
            render();
        }

        function save() {
            const s = document.getElementById('subject').value.trim();
            const n = document.getElementById('name').value.trim();
            const r = document.getElementById('date').value;
            if (!s || !n || !r) return;

            tasks.push({id: Date.now(), subject:s, name:n, dateRaw:r, desc:document.getElementById('desc').value});
            tg.CloudStorage.setItem('tasks_v30', JSON.stringify(tasks));
            togglePanel(); render();
            tg.HapticFeedback.notificationOccurred('success');
            ['subject','name','desc','date'].forEach(id => document.getElementById(id).value = '');
        }

        function render() {
            const list = document.getElementById('list');
            const search = document.getElementById('search').value.toLowerCase();
            list.innerHTML = '';
            
            const now = new Date(); now.setHours(0,0,0,0);
            
            let globalUrgency = 0;
            tasks.forEach(t => {
                const d = new Date(t.dateRaw); d.setHours(0,0,0,0);
                const diff = Math.round((d - now) / 86400000);
                if (diff < 0 || diff <= 2) globalUrgency = Math.max(globalUrgency, 3);
                else if (diff <= 5) globalUrgency = Math.max(globalUrgency, 2);
                else globalUrgency = Math.max(globalUrgency, 1);
            });

            const filtered = tasks.filter(t => {
                const d = new Date(t.dateRaw); d.setHours(0,0,0,0);
                const diff = Math.round((d - now) / 86400000);
                const match = t.name.toLowerCase().includes(search) || t.subject.toLowerCase().includes(search);
                return match && (tab === 'active' ? diff >= 0 : diff < 0);
            }).sort((a,b) => new Date(a.dateRaw) - new Date(b.dateRaw));

            if (!filtered.length) list.innerHTML = '<div style="text-align:center;margin-top:40px;color:var(--hint);font-style:italic;">Пусто</div>';

            filtered.forEach(t => {
                const d = new Date(t.dateRaw); d.setHours(0,0,0,0);
                const diff = Math.round((d - now) / 86400000);
                
                let cls = 'success';
                if (diff < 0) cls = 'expired';
                else if (diff <= 2) cls = 'critical';
                else if (diff <= 5) cls = 'warning';

                const dayText = diff === 0 ? 'Сегодня!' : (diff < 0 ? 'Просрочено' : `Дней: ${diff}`);

                list.innerHTML += `<div class="card ${cls}">
                    <div class="card-dot"></div>
                    <div class="card-subj">${t.subject}</div>
                    <div class="card-name">${t.name}</div>
                    <div class="card-meta"><span>📅 ${d.toLocaleDateString()}</span><span>${dayText}</span></div>
                </div>`;
            });

            const headDot = document.getElementById('header-dot');
            headDot.className = 'status-dot';
            if (globalUrgency === 3) headDot.classList.add('dot-red');
            else if (globalUrgency === 2) headDot.classList.add('dot-yellow');
            else if (globalUrgency === 1) headDot.classList.add('dot-green');

            const activeCount = tasks.filter(t => (new Date(t.dateRaw).setHours(0,0,0,0) - now.getTime()) >= 0).length;
            document.getElementById('count-text').innerText = `${activeCount} ДЗ`;
        }
        initTheme();
    </script>
</body>
</html>
