<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Трекер АмГУ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background-color: var(--tg-theme-bg-color, #181818); color: var(--tg-theme-text-color, #ffffff); padding: 15px; margin: 0; }
        
        /* Все поля ввода выровнены влево */
        input, button { 
            width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 10px; 
            border: 1px solid var(--tg-theme-hint-color, #444); 
            background-color: var(--tg-theme-secondary-bg-color, #333);
            color: var(--tg-theme-text-color, #fff); font-size: 16px; 
            -webkit-appearance: none; display: block; outline: none;
            text-align: left !important; 
        }
        input::placeholder { color: var(--tg-theme-hint-color, #aaa); }

        /* Специально для поля даты на iPhone */
        .date-wrapper { position: relative; width: 100%; margin-bottom: 12px; }
        .date-wrapper input[type="date"] { color: transparent; min-height: 48px; margin-bottom: 0; }
        .date-wrapper input.has-value { color: #fff; text-align: left !important; }
        .date-placeholder { 
            position: absolute; left: 15px; top: 14px; 
            color: var(--tg-theme-hint-color, #aaa); 
            pointer-events: none; text-align: left; 
        }

        .save-btn { background-color: var(--tg-theme-button-color, #2481cc); font-weight: bold; border: none; color: #fff; text-align: center !important; }
        
        .task-card { background: var(--tg-theme-secondary-bg-color, #2c2c2c); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .task-date { color: #ff5e5e; font-size: 14px; display: block; margin-top: 5px; text-align: left; }
        
        .controls { display: flex; gap: 8px; margin-top: 12px; }
        .study-btn { background-color: #00b894; color: white; border: none; flex: 2; padding: 10px; font-weight: bold; text-align: center !important; border-radius: 8px; }
        .del-btn { background-color: #d63031; color: white; border: none; flex: 1; padding: 10px; text-align: center !important; border-radius: 8px; }

        .ai-box { 
            display: none; background: #1a1a1a; padding: 12px; border-radius: 8px; 
            margin-top: 10px; border-left: 4px solid #00b894; font-size: 14px; line-height: 1.5; 
        }
        .ai-title { color: #00b894; font-weight: bold; display: block; margin-top: 8px; font-size: 11px; text-transform: uppercase; }
    </style>
</head>
<body>

    <h2>Новый дедлайн</h2>
    <input type="text" id="sub-input" placeholder="Предмет (например, БД)">
    <input type="text" id="task-input" placeholder="Тема (например, Нормальные формы)">
    
    <div class="date-wrapper">
        <input type="date" id="task-date" onchange="this.classList.toggle('has-value', !!this.value); document.getElementById('date-placeholder').style.display = this.value ? 'none' : 'block';">
        <div class="date-placeholder" id="date-placeholder">Дата</div>
    </div>

    <button class="save-btn" onclick="addTask()">Добавить в список</button>

    <h2>Мои задачи</h2>
    <div id="tasks-list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        let tasks = [];

        // ЗАГРУЗКА: получаем данные из облака при старте
        tg.CloudStorage.getItem('amgu_tasks_v5', (err, val) => {
            if(!err && val) { 
                tasks = JSON.parse(val); 
                renderTasks(); 
            }
        });

        async function askAI(id, sub, theme) {
            const box = document.getElementById(`ai-${id}`);
            box.style.display = 'block';
            box.innerHTML = "<i>ИИ готовит конспект...</i>";
            tg.HapticFeedback.impactOccurred('medium');

            try {
                const r = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        messages: [{role: 'user', content: `Разбери тему "${theme}" по предмету "${sub}" для студента. Дай: ТЕЗИСЫ, ТЕРМИНЫ, ВОПРОСЫ, ЛАЙФХАК. Пиши на русском.`}],
                        model: 'openai',
                        private: true
                    })
                });
                
                const text = await r.text();
                
                if (text.includes('error') || text.length < 10) {
                    box.innerHTML = "<span style='color:#ff4d4d'>У ИИ перегрузка. Попробуй еще раз через минуту.</span>";
                } else {
                    box.innerHTML = text.replace(/(ТЕЗИСЫ|ТЕРМИНЫ|ВОПРОСЫ|ЛАЙФХАК):/g, '<span class="ai-title">$1</span>');
                }
            } catch (e) { box.innerText = "Ошибка сети. Проверь LTE."; }
        }

        function addTask() {
            const sub = document.getElementById('sub-input').value;
            const task = document.getElementById('task-input').value;
            const date = document.getElementById('task-date').value;

            if(!sub || !task || !date) return tg.showAlert("Заполни все поля!");

            const newTask = {
                id: Date.now(), 
                sub, 
                task, 
                date: new Date(date).toLocaleDateString('ru-RU')
            };

            tasks.push(newTask);
            saveData(); // СОХРАНЕНИЕ
            renderTasks();
            
            tg.HapticFeedback.notificationOccurred('success');
            
            // Очистка полей
            document.getElementById('sub-input').value = '';
            document.getElementById('task-input').value = '';
            document.getElementById('task-date').value = '';
            document.getElementById('task-date').classList.remove('has-value');
            document.getElementById('date-placeholder').style.display = 'block';
        }

        function deleteTask(id) {
            tg.showConfirm('Удалить?', (ok) => {
                if(ok) { 
                    tasks = tasks.filter(t => t.id !== id); 
                    saveData(); // СОХРАНЕНИЕ после удаления
                    renderTasks(); 
                }
            });
        }

        // Функция записи в облако Телеграм
        function saveData() {
            tg.CloudStorage.setItem('amgu_tasks_v5', JSON.stringify(tasks), (err) => {
                if(err) console.error("Ошибка сохранения в облако");
            });
        }

        function renderTasks() {
            const list = document.getElementById('tasks-list');
            if (tasks.length === 0) {
                list.innerHTML = '<p style="color:#aaa; font-size:14px;">Список пуст</p>';
                return;
            }
            list.innerHTML = tasks.map(t => `
                <div class="task-card">
                    <strong>${t.sub}</strong>: ${t.task}
                    <span class="task-date">До: ${t.date}</span>
                    <div id="ai-${t.id}" class="ai-box"></div>
                    <div class="controls">
                        <button class="study-btn" onclick="askAI(${t.id}, '${t.sub}', '${t.task}')">📚 Подготовиться</button>
                        <button class="del-btn" onclick="deleteTask(${t.id})">🗑</button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
