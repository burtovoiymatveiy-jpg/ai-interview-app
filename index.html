<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер АмГУ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Глобальный сброс для ровных полей */
        * { box-sizing: border-box; }
        
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color, #181818); color: var(--tg-theme-text-color, #ffffff); padding: 15px; margin: 0; }
        
        /* Одинаковый стиль для всех полей */
        input, button { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 12px; 
            border-radius: 10px; 
            border: 1px solid var(--tg-theme-hint-color, #444); 
            background-color: var(--tg-theme-secondary-bg-color, #333);
            color: var(--tg-theme-text-color, #fff);
            font-size: 16px; 
            -webkit-appearance: none; /* Убирает баг iOS */
            appearance: none;
            display: block;
        }
        
        input::placeholder { color: var(--tg-theme-hint-color, #aaa); }

        .date-wrapper { position: relative; width: 100%; margin-bottom: 12px; }
        .date-wrapper input[type="date"] { margin-bottom: 0; color: transparent; min-height: 48px; }
        .date-wrapper input[type="date"].has-value { color: var(--tg-theme-text-color, #fff); }
        .date-placeholder { position: absolute; left: 15px; top: 14px; color: var(--tg-theme-hint-color, #aaa); pointer-events: none; }

        button.save-btn { 
            background-color: var(--tg-theme-button-color, #2481cc); 
            color: var(--tg-theme-button-text-color, #ffffff); 
            font-weight: bold; border: none; cursor: pointer;
        }
        
        h2 { margin-top: 10px; font-size: 20px; color: var(--tg-theme-text-color, #fff); }
        
        .task-card { 
            background-color: var(--tg-theme-secondary-bg-color, #2c2c2c); 
            padding: 15px; 
            border-radius: 10px; 
            margin-bottom: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .task-info { flex-grow: 1; }
        .task-date { color: #ff5e5e; font-size: 14px; display: block; margin-top: 4px; }
        
        .delete-btn { 
            background-color: #ff4d4d; color: white; border: none; 
            padding: 8px 12px; border-radius: 6px; cursor: pointer; 
            width: auto; margin: 0 0 0 10px; font-size: 14px;
        }
    </style>
</head>
<body>
    <h2>Добавить дедлайн</h2>
    
    <input type="text" id="subject-input" placeholder="Предмет">
    <input type="text" id="task-name" placeholder="Название (например, Лаба №1)">
    
    <div class="date-wrapper">
        <input type="date" id="task-date" onchange="dateChanged(this)">
        <div class="date-placeholder" id="date-placeholder">Дата</div>
    </div>

    <button class="save-btn" onclick="addTask()">Сохранить задачу</button>

    <h2>Мои задачи</h2>
    <div id="tasks-list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let tasks = [];

        // Загрузка сохраненных задач из облака Telegram при старте
        tg.CloudStorage.getItem('amgu_deadlines', (err, value) => {
            if (!err && value) {
                tasks = JSON.parse(value);
                renderTasks();
            }
        });

        // Функция сохранения в облако
        function saveToCloud() {
            tg.CloudStorage.setItem('amgu_deadlines', JSON.stringify(tasks));
        }

        function dateChanged(input) {
            const placeholder = document.getElementById('date-placeholder');
            if (input.value) {
                input.classList.add('has-value');
                placeholder.style.display = 'none';
            } else {
                input.classList.remove('has-value');
                placeholder.style.display = 'block';
            }
        }

        function addTask() {
            const subject = document.getElementById('subject-input').value;
            const name = document.getElementById('task-name').value;
            const date = document.getElementById('task-date').value;

            if (!subject || !name || !date) {
                tg.showAlert("Пожалуйста, заполните все поля!");
                return;
            }

            const dateObj = new Date(date);
            const formattedDate = dateObj.toLocaleDateString('ru-RU');

            tasks.push({ id: Date.now(), subject, name, date: formattedDate });
            saveToCloud();
            
            document.getElementById('subject-input').value = '';
            document.getElementById('task-name').value = '';
            document.getElementById('task-date').value = '';
            dateChanged(document.getElementById('task-date'));

            tg.HapticFeedback.notificationOccurred('success');
            renderTasks();
        }

        function deleteTask(id) {
            tg.showConfirm('Точно удалить этот дедлайн?', (confirmed) => {
                if (confirmed) {
                    tasks = tasks.filter(t => t.id !== id);
                    saveToCloud();
                    tg.HapticFeedback.impactOccurred('light');
                    renderTasks();
                }
            });
        }

        function renderTasks() {
            const list = document.getElementById('tasks-list');
            list.innerHTML = '';
            tasks.forEach(task => {
                list.innerHTML += `
                    <div class="task-card">
                        <div class="task-info">
                            <strong>${task.subject}</strong><br>
                            ${task.name}
                            <span class="task-date">До: ${task.date}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteTask(${task.id})">Удалить</button>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
