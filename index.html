<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>АмГУ: Трекер v0.27</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Темная тема (Default) */
            --bg: #000000;
            --sec-bg: #1c1c1d;
            --text: #ffffff;
            --hint: #8e8e93;
            --accent: #007aff;
            --card-bg: #1c1c1d;
            --danger: #ff3b30; 
            --warning: #ffcc00;
            --success: #34c759;
            --panel-bg: #1c1c1d;
            --input-bg: #2c2c2e;
        }

        [data-theme="light"] {
            --bg: #f2f2f7;
            --sec-bg: #ffffff;
            --text: #000000;
            --hint: #8e8e93;
            --accent: #007aff;
            --card-bg: #ffffff;
            --panel-bg: #ffffff;
            --input-bg: #f2f2f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background-color: var(--bg); color: var(--text); 
            padding: 20px 16px; display: flex; flex-direction: column;
            min-height: 100vh; transition: background 0.3s, color 0.3s;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .header h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.5px; }
        
        .header-btns { display: flex; align-items: center; gap: 10px; }
        
        .theme-toggle {
            background: var(--sec-bg); border: 1px solid rgba(128,128,128,0.1); 
            width: 40px; height: 40px; border-radius: 12px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; font-size: 18px;
        }

        .status-pill {
            background: var(--sec-bg); padding: 6px 12px; border-radius: 20px;
            display: flex; align-items: center; gap: 8px; border: 1px solid rgba(128,128,128,0.1);
        }
        .status-count { font-size: 13px; font-weight: 700; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hint); position: relative; }

        .search-box {
            background: var(--sec-bg); border-radius: 12px; padding: 12px;
            margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
        }
        .search-box input { background: transparent; border: none; color: var(--text); font-size: 16px; width: 100%; outline: none; }

        .tabs { display: flex; background: var(--sec-bg); padding: 2px; border-radius: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; text-align: center; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; color: var(--hint); }
        .tab.active { background: var(--accent); color: #fff; }

        .card { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 12px; border-left: 5px solid var(--success); }
        .card.critical { border-left-color: var(--danger); }
        .card.warning { border-left-color: var(--warning); }
        .card.expired { border-left-color: var(--hint); opacity: 0.6; }

        .card-subj { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }
        .card-name { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
        .card-meta { font-size: 12px; color: var(--hint); display: flex; justify-content: space-between; }

        .fab {
            position: fixed; bottom: 35px; right: 20px; 
            width: 58px; height: 58px; background: var(--accent); border-radius: 50%; 
            color: #fff; font-size: 30px; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            display: grid; place-items: center; border: none; z-index: 100;
        }

        .panel {
            position: fixed; bottom: -100%; left: 0; width: 100%; background: var(--panel-bg);
            border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px;
            transition: 0.4s cubic-bezier(0.1, 0.8, 0.2, 1); z-index: 200;
        }
        .panel.open { bottom: 0; }
        .panel input, .panel textarea { 
            width: 100%; background: var(--input-bg); border: 1px solid rgba(128,128,128,0.1);
            border-radius: 14px; padding: 15px; color: var(--text); font-size: 16px; margin-bottom: 12px; outline: none;
        }

        .footer { padding: 30px 0; text-align: center; margin-top: auto; }
        .version-tag { font-size: 9px; color: var(--hint); opacity: 0.5; letter-spacing: 2px; font-weight: 700; }
    </style>
</head>
<body data-theme="dark">

    <div class="header">
        <h1>АмГУ: Трекер</h1>
        <div class="header-btns">
            <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">🌙</button>
            <div class="status-pill">
                <span class="status-count" id="count-text">0 ДЗ</span>
                <div class="status-dot"></div>
            </div>
        </div>
    </div>

    <div class="search-box">
        <span>🔍</span>
        <input type="text" id="search" placeholder="Поиск..." oninput="render()">
    </div>

    <div class="tabs">
        <div id="t-act" class="tab active" onclick="setTab('active')">В работе</div>
        <div id="t-exp" class="tab" onclick="setTab('expired')">Просрочено</div>
    </div>

    <div id="list"></div>

    <div class="footer">
        <div class="version-tag">BETA v0.27</div>
    </div>

    <button class="fab" onclick="togglePanel()"><span>+</span></button>

    <div class="panel" id="panel">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <h2 id="p-title">Задание</h2>
            <span onclick="togglePanel()" style="font-size:24px; cursor:pointer;">✕</span>
        </div>
        <input type="text" id="subject" placeholder="Предмет">
        <input type="text" id="name" placeholder="Что нужно сделать?">
        <textarea id="desc" placeholder="Описание (необязательно)"></textarea>
        <input type="date" id="date">
        <button style="background:var(--accent); color:#fff; width:100%; padding:16px; border-radius:14px; border:none; font-weight:700;" onclick="save()">Сохранить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        let tasks = [];
        let tab = 'active';
        let editId = null;

        function initTheme() {
            const saved = localStorage.getItem('user-theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (systemDark ? 'dark' : 'light');
            setTheme(theme);
        }

        function setTheme(t) {
            document.body.setAttribute('data-theme', t);
            document.getElementById('theme-btn').innerText = t === 'dark' ? '🌙' : '☀️';
            localStorage.setItem('user-theme', t);
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
            tg.HapticFeedback.impactOccurred('medium');
        }

        tg.ready();
        tg.CloudStorage.getItem('tasks_v27', (err, val) => {
            if (!err && val) tasks = JSON.parse(val);
            render();
        });

        function togglePanel() {
            document.getElementById('panel').classList.toggle('open');
            if (!document.getElementById('panel').classList.contains('open')) {
                editId = null;
                ['subject','name','desc','date'].forEach(id => document.getElementById(id).value = '');
            }
        }

        function setTab(t) {
            tab = t;
            document.getElementById('t-act').classList.toggle('active', t === 'active');
            document.getElementById('t-exp').classList.toggle('active', t === 'expired');
            render();
        }

        function save() {
            const s = document.getElementById('subject').value;
            const n = document.getElementById('name').value;
            const r = document.getElementById('date').value;
            if (!s || !n || !r) return;

            const data = {id: editId || Date.now(), subject:s, name:n, dateRaw:r, desc: document.getElementById('desc').value};
            
            if (editId) {
                const i = tasks.findIndex(t => t.id === editId);
                tasks[i] = data;
            } else {
                tasks.push(data);
            }

            tg.CloudStorage.setItem('tasks_v27', JSON.stringify(tasks));
            togglePanel();
            render();
        }

        function render() {
            const list = document.getElementById('list');
            const search = document.getElementById('search').value.toLowerCase();
            list.innerHTML = '';
            const now = new Date(); now.setHours(0,0,0,0);
            
            const filtered = tasks.filter(t => {
                const d = new Date(t.dateRaw);
                const diff = Math.ceil((d - now) / 86400000);
                const match = t.name.toLowerCase().includes(search) || t.subject.toLowerCase().includes(search);
                return match && (tab === 'active' ? diff >= 0 : diff < 0);
            });

            filtered.forEach(t => {
                const d = new Date(t.dateRaw);
                const diff = Math.ceil((d - now) / 86400000);
                const cls = diff < 0 ? 'expired' : (diff <= 2 ? 'critical' : (diff <= 5 ? 'warning' : ''));
                list.innerHTML += `
                    <div class="card ${cls}">
                        <div class="card-subj">${t.subject}</div>
                        <div class="card-name">${t.name}</div>
                        <div class="card-meta">
                            <span>📅 ${d.toLocaleDateString()}</span>
                            <span>Дней: ${diff}</span>
                        </div>
                    </div>`;
            });
            document.getElementById('count-text').innerText = `${tasks.length} ДЗ`;
        }

        initTheme();
    </script>
</body>
</html>
