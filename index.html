<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>АмГУ Трекер Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #181818);
            --sec-bg: var(--tg-theme-secondary-bg-color, #242424);
            --text: var(--tg-theme-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #aaaaaa);
            --accent: var(--tg-theme-button-color, #2481cc);
            --acc-txt: var(--tg-theme-button-text-color, #ffffff);
            --danger: #ff3b30; 
            --warning: #ff9500;
            --success: #34c759;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg); color: var(--text); 
            padding: 15px 15px 100px 15px; line-height: 1.4;
            overflow-x: hidden;
        }

        /* ШАПКА */
        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .app-header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        #task-counter { font-size: 12px; color: var(--hint); background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 20px; }

        /* ПОИСК (GLASS) */
        .search-box {
            position: sticky; top: 10px; z-index: 10;
            background: rgba(36, 36, 36, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; margin-bottom: 15px;
        }
        .search-box input {
            width: 100%; padding: 12px 15px; border: none; background: transparent;
            color: var(--text); font-size: 15px; outline: none;
        }

        /* ТАБЫ */
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; background: var(--sec-bg); border-radius: 12px; padding: 4px; }
        .tab { 
            flex: 1; padding: 10px; text-align: center; border-radius: 9px; cursor: pointer;
            color: var(--hint); font-size: 14px; font-weight: 600; transition: 0.2s;
        }
        .tab.active { background: var(--accent); color: var(--acc-txt); }

        /* КАРТОЧКИ */
        .card {
            background: var(--sec-bg); border-radius: 18px; padding: 18px; margin-bottom: 15px;
            border-left: 8px solid var(--success);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            animation: slideUp 0.4s ease-out; position: relative;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* ПУЛЬСАЦИЯ ДЛЯ КРИТИЧЕСКИХ */
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(255,59,48,0.4); } 70% { box-shadow: 0 0 0 10px rgba(255,59,48,0); } 100% { box-shadow: 0 0 0 0 rgba(255,59,48,0); } }
        .card.critical { border-left-color: var(--danger); animation: slideUp 0.4s ease-out, pulseRed 2s infinite; }
        .card.warning { border-left-color: var(--warning); }
        .card.expired { border-left-color: #666; opacity: 0.6; filter: grayscale(0.5); }

        .card-subj { font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
        .card-name { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
        .card-desc { font-size: 14px; color: var(--hint); margin-bottom: 15px; }
        .card-meta { 
            font-size: 12px; display: flex; justify-content: space-between; 
            color: var(--hint); border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px;
        }

        .card-actions { display: flex; gap: 8px; margin-top: 15px; }
        .btn-s { flex: 1; padding: 10px; font-size: 12px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; }
        .edit-btn { background: rgba(255,255,255,0.06); color: var(--text); }
        .del-btn { background: rgba(255, 59, 48, 0.1); color: var(--danger); }

        /* ВЕРСИЯ */
        .version-tag {
            text-align: center; font-size: 10px; color: var(--hint);
            opacity: 0.3; margin: 30px 0 10px; letter-spacing: 1px; text-transform: uppercase;
        }

        /* ВЫЕЗЖАЮЩАЯ ПАНЕЛЬ */
        .add-panel {
            position: fixed; bottom: -100%; left: 0; width: 100%;
            background: rgba(28, 28, 28, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            padding: 25px 20px 40px; z-index: 100;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.4);
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .add-panel.open { bottom: 0; }
        .add-panel-header { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; }
        
        input, textarea { 
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 14px; color: var(--text); font-size: 16px; margin-bottom: 12px; outline: none;
        }
        input:focus { border-color: var(--accent); }
        
        .date-container { position: relative; margin-bottom: 15px; }
        #date { color: transparent; }
        #date.has-value { color: var(--text); }
        .date-label { position: absolute; left: 14px; top: 14px; color: var(--hint); pointer-events: none; }

        .btn-main { background: var(--accent); color: var(--acc-txt); padding: 16px; width: 100%; font-size: 16px; border-radius: 14px; border: none; font-weight: 700; }

        /* FAB */
        .fab {
            position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px;
            background: var(--accent); border-radius: 30px; color: white;
            font-size: 32px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.4); z-index: 90;
            transition: 0.3s;
        }
        .fab.open { transform: rotate(45deg); background: var(--sec-bg); }

        .empty { text-align: center; padding: 60px 20px; color: var(--hint); font-style: italic; }
    </style>
</head>
<body>

    <div class="app-header">
        <h1>АмГУ Трекер Pro</h1>
        <div id="task-counter">0 активных</div>
    </div>

    <div class="search-box">
        <input type="text" id="search" placeholder="🔍 Поиск задания или предмета..." oninput="render()">
    </div>

    <div class="tabs">
        <div id="t-act" class="tab active" onclick="setTab('active')">В работе</div>
        <div id="t-exp" class="tab" onclick="setTab('expired')">Просрочено</div>
    </div>

    <div id="list"></div>
    
    <div class="version-tag">бета версия 0.25</div>

    <div class="fab" id="fab" onclick="toggleForm()">+</div>

    <div class="add-panel" id="panel">
        <div class="add-panel-header">
            <h2 id="f-header">✍️ Новый дедлайн</h2>
            <div onclick="toggleForm()" style="font-size: 28px; color: var(--hint); cursor: pointer;">×</div>
        </div>
        <input type="text" id="subject" placeholder="📚 Предмет">
        <input type="text" id="name" placeholder="📝 Что сделать?">
        <textarea id="desc" placeholder="ℹ️ Описание (необязательно)"></textarea>
        <div class="date-container">
            <input type="date" id="date" onchange="uDate(this)">
            <div class="date-label" id="d-label">📅 Крайний срок</div>
        </div>
        <button class="btn-main" id="save-btn" onclick="save()">Сохранить задачу</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let tasks = [];
        let editId = null;
        let tab = 'active';

        // Загрузка
        tg.CloudStorage.getItem('amgu_v11', (err, val) => {
            if (!err && val) { try { tasks = JSON.parse(val); } catch(e) { tasks = []; } }
            render();
        });

        function escape(s) {
            let div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        function parseDate(raw) {
            const p = raw.split('-');
            return new Date(p[0], p[1] - 1, p[2]);
        }

        function uDate(el) {
            document.getElementById('d-label').style.display = el.value ? 'none' : 'block';
            el.classList.toggle('has-value', !!el.value);
        }

        function toggleForm() {
            document.getElementById('panel').classList.toggle('open');
            document.getElementById('fab').classList.toggle('open');
            if (editId) reset();
        }

        function setTab(t) {
            tab = t;
            document.getElementById('t-act').classList.toggle('active', t === 'active');
            document.getElementById('t-exp').classList.toggle('active', t === 'expired');
            render();
        }

        function save() {
            const s = document.getElementById('subject').value.trim();
            const n = document.getElementById('name').value.trim();
            const d = document.getElementById('desc').value.trim();
            const r = document.getElementById('date').value;

            if (!s || !n || !r) return tg.showAlert("Заполни все поля!");

            if (editId) {
                const i = tasks.findIndex(x => x.id === editId);
                if (i !== -1) tasks[i] = { ...tasks[i], subject: s, name: n, desc: d, dateRaw: r };
            } else {
                tasks.push({ id: Date.now(), subject: s, name: n, desc: d, dateRaw: r });
            }

            tg.CloudStorage.setItem('amgu_v11', JSON.stringify(tasks));
            reset();
            toggleForm();
            render();
            tg.HapticFeedback.notificationOccurred('success');
        }

        function reset() {
            ['subject','name','desc','date'].forEach(id => document.getElementById(id).value = '');
            uDate(document.getElementById('date'));
            document.getElementById('f-header').innerText = "✍️ Новый дедлайн";
            editId = null;
        }

        function edit(id) {
            const t = tasks.find(x => x.id === id);
            if (!t) return;
            document.getElementById('subject').value = t.subject;
            document.getElementById('name').value = t.name;
            document.getElementById('desc').value = t.desc;
            document.getElementById('date').value = t.dateRaw;
            uDate(document.getElementById('date'));
            editId = id;
            document.getElementById('f-header').innerText = "🔄 Изменение";
            toggleForm();
        }

        function del(id) {
            tg.showConfirm("Удалить задачу?", (ok) => {
                if(ok) {
                    tasks = tasks.filter(x => x.id !== id);
                    tg.CloudStorage.setItem('amgu_v11', JSON.stringify(tasks));
                    render();
                    tg.HapticFeedback.impactOccurred('medium');
                }
            });
        }

        function render() {
            const container = document.getElementById('list');
            const search = document.getElementById('search').value.toLowerCase();
            container.innerHTML = '';
            
            const now = new Date();
            now.setHours(0,0,0,0);

            const filtered = tasks.filter(t => {
                const diff = Math.ceil((parseDate(t.dateRaw) - now) / 86400000);
                const match = t.subject.toLowerCase().includes(search) || t.name.toLowerCase().includes(search);
                return match && (tab === 'active' ? diff >= 0 : diff < 0);
            }).sort((a,b) => parseDate(a.dateRaw) - parseDate(b.dateRaw));

            document.getElementById('task-counter').innerText = `${tasks.filter(t => Math.ceil((parseDate(t.dateRaw)-now)/86400000)>=0).length} активных`;

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty">Здесь пока ничего нет</div>';
                return;
            }

            filtered.forEach(t => {
                const diff = Math.ceil((parseDate(t.dateRaw) - now) / 86400000);
                const cls = diff < 0 ? 'expired' : (diff <= 2 ? 'critical' : (diff <= 5 ? 'warning' : ''));
                
                container.innerHTML += `
                    <div class="card ${cls}">
                        <div class="card-subj">${escape(t.subject)}</div>
                        <div class="card-name">${escape(t.name)}</div>
                        ${t.desc ? `<div class="card-desc">${escape(t.desc)}</div>` : ''}
                        <div class="card-meta">
                            <span>📅 ${parseDate(t.dateRaw).toLocaleDateString()}</span>
                            <span style="font-weight:800">${diff < 0 ? 'Срок истек' : 'Дней: ' + diff}</span>
                        </div>
                        <div class="card-actions">
                            <button class="btn-s edit-btn" onclick="edit(${t.id})">✏️ Изменить</button>
                            <button class="btn-s del-btn" onclick="del(${t.id})">🗑️ Удалить</button>
                        </div>
                    </div>`;
            });
        }
    </script>
</body>
</html>
