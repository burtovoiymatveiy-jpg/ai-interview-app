name: Update AmGU Schedule

on:
  schedule:
    - cron: '0 3 * * *' # Запуск каждую ночь в 03:00
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Parser
        run: python scripts/parser.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data/schedule.json
          git commit -m "Автоматическое обновление расписания" || exit 0
          git push
